<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Smart Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <span class="text-white">
                Customers
            </span>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <div class="col-md-2 bg-white min-vh-100 p-3">

                <div class="list-group">

                    <a href="index.html" class="list-group-item list-group-item-action">
                        Dashboard
                    </a>

                    <a href="products-list.html" class="list-group-item list-group-item-action">
                        Products
                    </a>

                    <a href="inventory.html" class="list-group-item list-group-item-action">
                        Inventory
                    </a>

                    <a href="invoice-history.html" class="list-group-item list-group-item-action">
                        Invoices
                    </a>

                    <a href="customers.html" class="list-group-item list-group-item-action active">
                        Customers
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Settings
                    </a>

                </div>

            </div>


            <!-- MAIN CONTENT -->

            <main class="col-md-10 p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h2 class="fw-bold">
                            Customers
                        </h2>

                        <p class="text-muted mb-0">
                            Manage your customers and their information.
                        </p>

                    </div>

                    <a href="customer-form.html" class="btn btn-primary">
                        + Add Customer
                    </a>


                </div>


                <!-- SEARCH -->

                <div class="mb-3">

                    <input type="text" id="customerSearch" class="form-control" placeholder="Search customer...">

                </div>


                <!-- CUSTOMER TABLE -->

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover">

                                <thead class="table-light">

                                    <tr>
                                        <th>Name</th>
                                        <th>Phone</th>
                                        <th>Email</th>
                                        <th>Address</th>
                                        <th>Actions</th>
                                    </tr>

                                </thead>

                                <tbody id="customersTableBody">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <div id="emptyCustomersMessage" class="alert alert-info mt-3">
                    No customers added yet.
                </div>

            </main>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
