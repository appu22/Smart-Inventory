<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer - Smart Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <a href="customers.html" class="btn btn-secondary">
                ← Customers
            </a>

        </div>

    </nav>


    <div class="container py-4">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="fw-bold mb-4">
                    Add Customer
                </h3>

                <form id="customerForm">

                    <div class="mb-3">

                        <label for="customerName" class="form-label">
                            Customer Name
                        </label>

                        <input type="text" id="customerName" class="form-control" required>

                    </div>


                    <div class="mb-3">

                        <label for="customerPhone" class="form-label">
                            Phone
                        </label>

                        <input type="tel" id="customerPhone" class="form-control">

                    </div>


                    <div class="mb-3">

                        <label for="customerEmail" class="form-label">
                            Email
                        </label>

                        <input type="email" id="customerEmail" class="form-control">

                    </div>


                    <div class="mb-3">

                        <label for="customerAddress" class="form-label">
                            Address
                        </label>

                        <textarea id="customerAddress" class="form-control" rows="3"></textarea>

                    </div>


                    <button type="submit" class="btn btn-primary">
                        Save Customer
                    </button>

                    <a href="customers.html" class="btn btn-secondary ms-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
