<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Details - Smart Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <a href="customers.html" class="btn btn-secondary">
                ← Customers
            </a>

        </div>

    </nav>


    <div class="container py-4">

        <div id="customerDetails">
            <!-- Customer details will appear here -->
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">

                <h4 class="fw-bold mb-3">Invoice History</h4>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Invoice Number</th>
                                <th>Date</th>
                                <th>Total Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="customerInvoiceHistory">
                            <tr>
                                <td colspan="4" class="text-center text-muted">
                                    Loading invoices...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- // Step 37.13.4: Handle customers with no invoices -->
                <div id="noCustomerInvoices" class="alert alert-info text-center" style="display: none;">
                    <strong>No invoices yet.</strong>
                    <p class="mb-0">
                        Invoices created for this customer will appear here.
                    </p>
                </div>

            </div>
        </div>

        <!-- Step 37.9: Edit Customer -->
        <button id="editCustomerButton" class="btn btn-primary me-2" style="display: none;">
            Edit Customer
        </button>

        <div class="mt-3">

            <button id="deleteCustomerButton" class="btn btn-danger" style="display: none;">
                Delete Customer
            </button>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
