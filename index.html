<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory & Invoice Generator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body><!-- ========================= TOP NAVBAR ========================== -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                Smart Inventory
            </a>

            <div class="text-white">
                🔔 &nbsp; Admin
            </div>

        </div>
    </nav>


    <!-- ========================= MAIN APPLICATION ========================== -->

    <div class="container-fluid">

        <div class="row">


            <!-- =========================  SIDEBAR ========================== -->

            <div class="col-md-2 bg-light min-vh-100 p-3">

                <h6 class="text-secondary mb-3">
                    MENU
                </h6>

                <div class="list-group">

                    <a href="#" class="list-group-item list-group-item-action active">
                        Dashboard
                    </a>

                    <!-- <a href="#" class="list-group-item list-group-item-action">
                        Products
                    </a> -->

                    <!-- <a href="products.html" class="list-group-item list-group-item-action">
                        Products
                    </a> -->

                    <a href="products-list.html" class="list-group-item list-group-item-action">
                        Products
                    </a>



                    <!-- <a href="#" class="list-group-item list-group-item-action">
                        Inventory
                    </a> -->

                    <a href="inventory.html" class="list-group-item list-group-item-action">
                        Inventory
                    </a>


                    <!-- <a href="#" class="list-group-item list-group-item-action">
                        Invoices
                    </a> -->

                    <!-- <a href="invoice.html" class="list-group-item list-group-item-action">
                        Invoices
                    </a> -->

                    <a href="invoice-history.html" class="list-group-item list-group-item-action">
                        Invoices
                    </a>


                    <a href="#" class="list-group-item list-group-item-action">
                        Customers
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Settings
                    </a>

                </div>

            </div>


            <!-- =========================   MAIN CONTENT ========================== -->

            <main class="col-md-10 p-4">

                <h2 class="mb-1">
                    Dashboard
                </h2>

                <p class="text-muted text-start mt-0">
                    Welcome to your inventory management system.
                </p>

                <div id="lowStockAlert"></div>

                <!-- =========================  STATISTICS CARDS   ========================== -->

                <div class="row g-4 mt-2">


                    <!-- Total Products -->

                    <div class="col-md-3">

                        <div class="card shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total Products
                                </h6>

                                <h2 id="totalProducts">
                                    0
                                </h2>


                            </div>

                        </div>

                    </div>


                    <!-- Products In Stock -->

                    <div class="col-md-3">

                        <div class="card shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Products In Stock
                                </h6>

                                <h2 id="productsInStock">
                                    0
                                </h2>


                            </div>

                        </div>

                    </div>


                    <!-- Low Stock -->

                    <div class="col-md-3">

                        <div class="card shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Low Stock
                                </h6>

                                <h2 id="lowStockProducts">
                                    0
                                </h2>


                            </div>

                        </div>

                    </div>


                    <!-- Total Sales -->

                    <div class="col-md-3">

                        <div class="card shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total Sales
                                </h6>

                                <h2 id="totalSales">₹0</h2>


                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================  RECENT PRODUCTS  ========================== -->

                <div class="card shadow-sm mt-4">

                    <div class="card-body">

                        <h5 class="card-title">
                            Recent Products
                        </h5>

                        <div class="table-responsive">

                            <table class="table table-hover mt-3">

                                <thead class="table-light">

                                    <tr>
                                        <th>Product</th>
                                        <th>SKU</th>
                                        <th>Category</th>
                                        <th>Stock</th>
                                        <th>Price</th>
                                        <th>Status</th>
                                    </tr>

                                </thead>

                                <tbody id="recentProductsTableBody">

                                    <!-- <tr>

                                        <td colspan="5" class="text-center text-muted">
                                            No products added yet.
                                        </td>

                                    </tr> -->

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->

    <script src="script.js"></script>

</body>

</html>
