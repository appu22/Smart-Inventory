<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory - Smart Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <span class="text-white">
                Inventory
            </span>

        </div>
    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <div class="col-md-2 bg-white min-vh-100 p-3">

                <div class="list-group">

                    <a href="index.html" class="list-group-item list-group-item-action">
                        Dashboard
                    </a>

                    <a href="products-list.html" class="list-group-item list-group-item-action">
                        Products
                    </a>

                    <a href="inventory.html" class="list-group-item list-group-item-action active">
                        Inventory
                    </a>

                    <a href="invoice-history.html" class="list-group-item list-group-item-action">
                        Invoices
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Customers
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Settings
                    </a>

                </div>

            </div>


            <!-- MAIN CONTENT -->

            <main class="col-md-10 p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h2 class="fw-bold">
                            Inventory
                        </h2>

                        <p class="text-muted mb-0">
                            Monitor and manage your stock levels.
                        </p>
                    </div>

                </div>

                <div class="mb-3">

                    <input type="text" id="inventorySearch" class="form-control"
                        placeholder="Search product, SKU, or category...">

                </div>

                <!--  Step 36.1: Add Inventory Summary Cards-->
                <div class="row g-3 mb-4">

                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted">
                                    Total Products
                                </h6>

                                <h3 id="inventoryTotalProducts" class="fw-bold">
                                    0
                                </h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted">
                                    Low Stock
                                </h6>

                                <h3 id="inventoryLowStock" class="fw-bold">
                                    0
                                </h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted">
                                    Out of Stock
                                </h6>

                                <h3 id="inventoryOutOfStock" class="fw-bold">
                                    0
                                </h3>
                            </div>
                        </div>
                    </div>

                </div>


                <!-- INVENTORY TABLE -->

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover">

                                <thead class="table-light">

                                    <tr>
                                        <th>Product</th>
                                        <th>SKU</th>
                                        <th>Category</th>
                                        <th>Current Stock</th>
                                        <th>Minimum Stock</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>

                                </thead>

                                <tbody id="inventoryTableBody">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <div id="emptyInventoryMessage" class="alert alert-info mt-3" style="display: none;">
                    No products available in inventory.
                </div>

            </main>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
