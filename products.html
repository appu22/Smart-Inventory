<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Smart Inventory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body><!-- =========================   NAVBAR  ========================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <div class="text-white">
                🔔 &nbsp; Admin
            </div>

        </div>

    </nav>


    <!-- =========================      MAIN CONTENT ========================== -->

    <div class="container py-4">

        <!-- Page Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    Add Product
                </h2>

                <p class="text-muted mb-0">
                    Add a new product to your inventory.
                </p>

            </div>

            <a href="index.html" class="btn btn-secondary">
                ← Back to Dashboard
            </a>

        </div>


        <!-- =========================  PRODUCT FORM    ========================== -->

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <form id="productForm">


                    <!-- Product Information -->

                    <h5 class="fw-bold mb-3">
                        Product Information
                    </h5>


                    <div class="row g-3">


                        <!-- Product Name -->

                        <div class="col-md-6">

                            <label for="productName" class="form-label">
                                Product Name
                            </label>

                            <input type="text" class="form-control" id="productName"
                                placeholder="Example: Dell Latitude 5430" required>

                        </div>


                        <!-- SKU -->

                        <div class="col-md-6">

                            <label for="sku" class="form-label">
                                SKU
                            </label>

                            <input type="text" class="form-control" id="sku" placeholder="Example: LAP-DELL-5430"
                                required>

                        </div>


                        <!-- Category -->

                        <div class="col-md-6">

                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select class="form-select" id="category" required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Laptop">
                                    Laptop
                                </option>

                                <option value="Desktop">
                                    Desktop
                                </option>

                                <option value="Printer">
                                    Printer
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Brand -->

                        <div class="col-md-6">

                            <label for="brand" class="form-label">
                                Brand
                            </label>

                            <input type="text" class="form-control" id="brand" placeholder="Example: Dell">

                        </div>


                    </div>


                    <hr class="my-4">


                    <!-- Pricing -->

                    <h5 class="fw-bold mb-3">
                        Pricing & Stock
                    </h5>


                    <div class="row g-3">


                        <!-- Purchase Price -->

                        <div class="col-md-4">

                            <label for="purchasePrice" class="form-label">
                                Purchase Price (₹)
                            </label>

                            <input type="number" class="form-control" id="purchasePrice" placeholder="0" min="0"
                                required>

                        </div>


                        <!-- Selling Price -->

                        <div class="col-md-4">

                            <label for="sellingPrice" class="form-label">
                                Selling Price (₹)
                            </label>

                            <input type="number" class="form-control" id="sellingPrice" placeholder="0" min="0"
                                required>

                        </div>


                        <!-- Quantity -->

                        <div class="col-md-4">

                            <label for="quantity" class="form-label">
                                Quantity
                            </label>

                            <input type="number" class="form-control" id="quantity" placeholder="0" min="0" required>

                        </div>


                        <!-- Minimum Stock -->

                        <div class="col-md-4">

                            <label for="minimumStock" class="form-label">
                                Minimum Stock Alert
                            </label>

                            <input type="number" class="form-control" id="minimumStock" placeholder="5" min="0"
                                required>

                            <div class="form-text">
                                Alert when stock reaches this level.
                            </div>

                        </div>


                    </div>


                    <hr class="my-4">


                    <!-- Product Description -->

                    <h5 class="fw-bold mb-3">
                        Additional Information
                    </h5>


                    <div class="mb-4">

                        <label for="description" class="form-label">
                            Description
                        </label>

                        <textarea class="form-control" id="description" rows="4"
                            placeholder="Enter product details..."></textarea>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-primary px-4">
                            Add Product
                        </button>

                        <button type="reset" class="btn btn-outline-secondary">
                            Clear
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->

    <script src="script.js"></script>

</body>

</html>
