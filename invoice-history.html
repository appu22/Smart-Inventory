<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice History - Smart Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body><!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">
                Smart Inventory
            </a>

            <a href="invoice.html" class="btn btn-primary">
                + New Invoice
            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container-fluid p-4">


        <div class="mb-4">

            <h2 class="fw-bold">
                Invoice History
            </h2>

            <p class="text-muted">
                View your previously generated invoices.
            </p>

        </div>


        <!-- INVOICE TABLE  step 27-->
        <div class="mb-3">

            <input type="text" id="invoiceSearch" class="form-control" placeholder="Search invoice or customer...">

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Invoice
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Customer
                                </th>

                                <th>
                                    Items
                                </th>

                                <th>
                                    Total
                                </th>
                                <th>
                                    Actions
                                </th>


                            </tr>

                        </thead>


                        <tbody id="invoiceHistoryTable">

                        </tbody>

                    </table>

                </div>


                <div id="noInvoicesMessage" class="text-center text-muted py-4">

                    No invoices found.

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
